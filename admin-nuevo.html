<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Nueva cuenta administrativa · COMRob 2026</title>
    <link href="assets/favicon.ico" rel="icon" type="image/x-icon"/>
    <link href="css/styles.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-lg-5">
                        <h1 class="h3 mb-3">Nueva cuenta administrativa</h1>

                        <p class="text-muted">
                            Crear la cuenta no concede acceso automáticamente.
                            Un superusuario deberá autorizar manualmente el UID
                            en Firebase.
                        </p>

                        <div
                            class="d-none"
                            id="adminRequestMessage"
                        ></div>

                        <form id="newAdminForm">
                            <div class="mb-3">
                                <label class="form-label" for="nombre">
                                    Nombre completo
                                </label>
                                <input
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    required
                                    type="text"
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Correo</label>
                                <input
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                                    type="email"
                                />
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="password">
                                    Contraseña
                                </label>
                                <input
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    minlength="8"
                                    required
                                    type="password"
                                />
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="confirmPassword">
                                    Confirmar contraseña
                                </label>
                                <input
                                    class="form-control"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    minlength="8"
                                    required
                                    type="password"
                                />
                            </div>

                            <button class="btn btn-danger" type="submit">
                                Crear cuenta y solicitar acceso
                            </button>

                            <a
                                class="btn btn-outline-secondary"
                                href="admin-login.html"
                            >
                                Regresar
                            </a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin-nuevo.js" type="module"></script>
</body>
</html>
