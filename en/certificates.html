<a class="btn btn-sm btn-outline-secondary rounded-pill px-3" href="../certificados.html" lang="es">Español</a>

<main class="comrob-cert-main">
<div class="comrob-cert-intro"><p class="small text-uppercase fw-semibold text-danger mb-2">COMRob 2026</p><h1>Presentation certificates</h1><p>Find your paper by ID, title or author and open your presentation certificate.</p></div>
<section class="card border-0 shadow-sm rounded-3 mb-4" aria-label="Certificate search"><div class="card-body p-4">
<form data-certificate-search>

</form>
<p class="small text-muted mt-3 mb-0" id="certificate-status" data-certificate-status role="status" aria-live="polite">Loading search…</p>
</div></section>
<div id="certificate-results" class="comrob-cert-results" data-certificate-results></div>
<noscript><p class="alert alert-light border">Enable JavaScript to search for your certificate.</p></noscript>
<p class="comrob-cert-help">If your certificate is not available, contact <a class="link-danger" href="mailto:comrob26@ibero.mx">comrob26@ibero.mx</a>.</p>
