<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Administración de registros · COMRob 2026</title>
    <link href="assets/favicon.ico" rel="icon" type="image/x-icon"/>
    <link href="css/styles.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="text-center mb-4">
                    <img
                        alt="COMROB"
                        class="img-fluid"
                        src="assets/Comrob_logo.png"
                        style="max-height:90px;"
                    />
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-lg-5">
                        <h1 class="h3 mb-3">Administración de registros</h1>
                        <p class="text-muted">
                            Acceso exclusivo para personal autorizado.
                        </p>

                        <div
                            class="alert alert-danger d-none"
                            id="loginError"
                        ></div>

                        <form id="adminLoginForm">
                            <div class="mb-3">
                                <label class="form-label" for="email">Correo</label>
                                <input
                                    autocomplete="username"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                                    type="email"
                                />
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="password">
                                    Contraseña
                                </label>
                                <input
                                    autocomplete="current-password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    required
                                    type="password"
                                />
                            </div>

                            <button class="btn btn-danger w-100" type="submit">
                                Iniciar sesión
                            </button>
                        </form>

                        <button
                            class="btn btn-link px-0 mt-3"
                            id="resetPassword"
                            type="button"
                        >
                            Olvidé mi contraseña
                        </button>

                        <hr>

                        <p class="small text-muted mb-2">
                            ¿Necesitas una cuenta administrativa?
                        </p>
                        <a
                            class="btn btn-outline-secondary btn-sm"
                            href="admin-nuevo.html"
                        >
                            Solicitar nueva cuenta
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/admin-login.js" type="module"></script>
</body>
</html>
