<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<meta name="description" content="Reconocimientos de ponencias · COMRob 2026"/>
<title>Reconocimientos de ponencias · COMRob 2026</title>
<link rel="icon" href="assets/favicon.ico"/>
<link rel="stylesheet" href="css/styles.css"/>
<link rel="stylesheet" href="css/certificados.css?v=20261102-cert1"/>
</head>
<body class="comrob-cert-page">
<header class="comrob-cert-header">
<a href="./" aria-label="Inicio COMRob 2026"><img src="assets/Comrob_logo.png" width="155" height="80" alt="COMRob 2026"/></a>
<a class="btn btn-sm btn-outline-secondary rounded-pill px-3" href="en/certificates.html" lang="en">English</a>
</header>
<main class="comrob-cert-main">
<div class="comrob-cert-intro"><p class="small text-uppercase fw-semibold text-danger mb-2">COMRob 2026</p><h1>Reconocimientos de ponencias</h1><p>Encuentra tu artículo por ID, título o autor y abre tu reconocimiento de presentación.</p></div>
<section class="card border-0 shadow-sm rounded-3 mb-4" aria-label="Buscador de reconocimientos"><div class="card-body p-4">
<form data-certificate-search>
<label class="form-label fw-semibold" for="certificate-query">ID, título o autor del artículo</label>
<div class="comrob-cert-form"><input class="form-control form-control-lg" id="certificate-query" type="search" autocomplete="off" placeholder="Por ejemplo: 85, haptic guidance o el nombre de un autor" aria-controls="certificate-results" aria-describedby="certificate-status"/><button class="btn btn-danger px-4" type="submit">Buscar</button></div>
</form>
<p class="small text-muted mt-3 mb-0" id="certificate-status" data-certificate-status role="status" aria-live="polite">Cargando buscador…</p>
</div></section>
<div id="certificate-results" class="comrob-cert-results" data-certificate-results></div>
<noscript><p class="alert alert-light border">Activa JavaScript para buscar tu reconocimiento.</p></noscript>
<p class="comrob-cert-help">Si tu reconocimiento no está disponible, escribe a <a class="link-danger" href="mailto:comrob26@ibero.mx">comrob26@ibero.mx</a>.</p>
</main>
<script src="js/comrob2026-ponencias.js?v=20261102-cert1"></script>
<script src="js/comrob2026-certificados.js?v=20261102-cert1"></script>
<script src="js/certificados.js?v=20261102-cert1"></script>
<script src="js/certificados-buscador.js?v=20261102-cert1"></script>
</body>
</html>
